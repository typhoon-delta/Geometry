name: Kiểm thử

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: dist/app.js khớp với mã nguồn
        run: npm run build && git diff --exit-code dist/
      - run: npm test

  lab:
    name: Phòng thí nghiệm (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r lab/requirements.txt
      - run: python -m unittest discover -s lab/tests -t . -v
