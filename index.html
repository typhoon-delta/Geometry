<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hình học động</title>
<link rel="stylesheet" href="vendor/jsxgraph/jsxgraph.css">
<link rel="stylesheet" href="css/style.css">
<script src="vendor/jsxgraph/jsxgraphcore.js"></script>
</head>
<body>
<header id="topbar">
  <div class="brand">△ Hình học động</div>
  <div class="group">
    <button id="btn-new" title="Hình mới">Mới</button>
    <select id="sel-example" title="Mở hình mẫu"></select>
    <span class="file-actions"></span>
  </div>
  <div class="group">
    <button id="btn-undo" title="Hoàn tác (Ctrl+Z)">↶ Hoàn tác</button>
    <button id="btn-redo" title="Làm lại (Ctrl+Y)">↷ Làm lại</button>
    <button id="btn-delete" title="Xoá đối tượng đang chọn (Delete)">🗑 Xoá</button>
  </div>
  <div class="group">
    <button id="btn-grid" title="Bật/tắt lưới (bắt điểm theo lưới)">Lưới</button>
    <button id="btn-fit" title="Thu phóng vừa hình">Vừa khung</button>
  </div>
  <div class="group extra-actions"></div>
  <div class="group right">
    <button id="btn-present" title="Tua từng bước dựng">▶ Trình bày</button>
    <button id="btn-projector" title="Nét đậm, chữ to, toàn màn hình">⛶ Trình chiếu</button>
  </div>
</header>
<main id="main">
  <aside id="tools"></aside>
  <section id="stage">
    <div id="board" class="jxgbox"></div>
    <div id="hint"></div>
    <button id="exit-projector" title="Thoát trình chiếu (Esc)">✕ Thoát trình chiếu</button>
    <div id="present-bar">
      <button id="btn-prev">◀ Trước</button>
      <span id="frame-label"></span>
      <button id="btn-next">Sau ▶</button>
      <button id="btn-exit-present" title="Thoát chế độ trình bày">✕</button>
    </div>
  </section>
  <aside id="side">
    <div class="tabs">
      <button class="tab active" data-tab="tab-steps">Các bước dựng</button>
      <button class="tab" data-tab="tab-explore" id="tab-btn-explore">Khám phá</button>
    </div>
    <div id="tab-steps" class="tabpane active">
      <div id="steps"></div>
      <div id="props"></div>
    </div>
    <div id="tab-explore" class="tabpane"></div>
  </aside>
</main>
<script src="dist/app.js"></script>
</body>
</html>
