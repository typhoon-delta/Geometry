<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hình học động</title>
<link rel="stylesheet" href="css/katex.css?v=1.4.1">
<link rel="stylesheet" href="css/style.css?v=1.4.1">
</head>
<body>
<header id="topbar">
  <div class="brand" title="Hình học động"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12.6" r="9" stroke="#3150d6"/><path d="M12 3.6L4.3 17.1h15.4z" stroke="#161b26" stroke-linejoin="round"/><circle cx="12" cy="3.6" r="1.7" fill="#fff" stroke="#161b26"/><circle cx="4.3" cy="17.1" r="1.7" fill="#fff" stroke="#161b26"/><circle cx="19.7" cy="17.1" r="1.7" fill="#fff" stroke="#161b26"/></svg><span>Hình học động</span></div>
  <nav class="menus">
    <div class="menu">
      <button class="menu-btn">Tệp</button>
      <div class="menu-pop">
        <button id="btn-new">Hình mới (tab mới)</button>
        <button id="btn-open">Mở tệp… <kbd>Ctrl+O</kbd></button>
        <button id="btn-save">Lưu tệp <kbd>Ctrl+S</kbd></button>
        <button id="btn-share">Chia sẻ bằng link…</button>
        <button id="btn-tikz">Xuất TikZ…</button>
        <button id="btn-latex">Xuất phiếu LaTeX (.tex)…</button>
      </div>
    </div>
    <div class="menu">
      <button class="menu-btn">Sửa</button>
      <div class="menu-pop">
        <button id="menu-undo">Hoàn tác <kbd>Ctrl+Z</kbd></button>
        <button id="menu-redo">Làm lại <kbd>Ctrl+Y</kbd></button>
        <button id="btn-delete">Xoá đối tượng đang chọn <kbd>Delete</kbd></button>
        <button id="btn-unlock-images">Mở khoá các ảnh nền</button>
      </div>
    </div>
    <div class="menu">
      <button class="menu-btn">Hiển thị</button>
      <div class="menu-pop">
        <div class="menu-label">Bộ kiểu</div>
        <button id="theme-mono" class="radio" data-theme="mono">Đơn sắc (kiểu Sketchpad)</button>
        <button id="theme-textbook" class="radio" data-theme="textbook">Sách giáo khoa (màu dịu)</button>
        <div class="menu-sep"></div>
        <button id="btn-grid" class="check">Lưới (bắt điểm theo lưới)</button>
        <button id="btn-trim" class="check" title="Đường thẳng chỉ vẽ qua các điểm nằm trên nó và nhô ra một đoạn ngắn, như hình trong sách">Đường thẳng vừa đủ (kiểu sách)</button>
        <button id="btn-fit">Thu phóng vừa hình <kbd>Home</kbd></button>
        <button id="menu-panel" class="check">Bảng các bước dựng</button>
      </div>
    </div>
    <div class="menu">
      <button class="menu-btn">Chèn</button>
      <div class="menu-pop">
        <button id="btn-box-loigiai">Khung lời giải <kbd>Ctrl+Enter</kbd></button>
        <button id="btn-box-de">Khung đề bài (chữ)</button>
        <button id="btn-box-ghichu">Khung ghi chú</button>
        <div class="menu-sep"></div>
        <button id="btn-image">Ảnh đề bài từ tệp… <kbd>Ctrl+V</kbd></button>
        <button id="btn-image-bg">Ảnh nền để đồ hình…</button>
        <div class="menu-sep"></div>
        <button id="btn-rules">Gõ tắt và tự đổi…</button>
      </div>
    </div>
    <div class="menu">
      <button class="menu-btn">Ví dụ</button>
      <div class="menu-pop examples-pop" id="example-menu"></div>
    </div>
  </nav>
  <div id="tabbar" title="Các hình đang mở"></div>
  <div class="spacer"></div>
  <button id="btn-undo" class="icon" title="Hoàn tác (Ctrl+Z)"></button>
  <button id="btn-redo" class="icon" title="Làm lại (Ctrl+Y)"></button>
  <span class="vsep"></span>
  <button id="btn-explore" class="icon" title="Khám phá: tìm quan hệ ẩn trong hình"></button>
  <button id="btn-present" class="icon" title="Trình bày: tua từng bước dựng"></button>
  <button id="btn-projector" class="icon" title="Trình chiếu: toàn màn hình, nét đậm, chữ to"></button>
  <button id="btn-panel" class="icon" title="Bảng các bước dựng / khám phá"></button>
</header>
<main id="main">
  <aside id="tools"></aside>
  <section id="stage">
    <div id="board"></div>
    <div id="tool-options"></div>
    <div id="props"></div>
    <div id="hint"></div>
    <button id="exit-projector" title="Thoát trình chiếu (Esc)">✕ Thoát trình chiếu</button>
    <div id="present-bar">
      <button id="btn-prev">◀ Trước</button>
      <span id="frame-label"></span>
      <button id="btn-next">Sau ▶</button>
      <button id="btn-exit-present" title="Thoát chế độ trình bày">✕</button>
    </div>
  </section>
  <aside id="side">
    <div class="tabs">
      <button class="tab active" data-tab="tab-steps">Các bước dựng</button>
      <button class="tab" data-tab="tab-explore" id="tab-btn-explore">Khám phá</button>
      <button class="tab-close" id="btn-close-panel" title="Ẩn bảng">✕</button>
    </div>
    <div id="tab-steps" class="tabpane active">
      <div id="steps"></div>
    </div>
    <div id="tab-explore" class="tabpane"></div>
  </aside>
</main>
<script src="dist/app.js?v=1.4.1"></script>
</body>
</html>
